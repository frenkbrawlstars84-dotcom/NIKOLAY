name: Verify portfolio
on:
  push:
    branches:
      - 'redesign/**'
  pull_request:
    branches:
      - main
      - final-stabilization-2026-11-13

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Capture real public demo previews where available
        run: |
          npm run capture:projects || echo "Public demo capture unavailable; using design covers"
      - name: Verify build and site behavior
        run: npm run test:browser
      - name: Package ready-to-publish Netlify site
        uses: actions/upload-artifact@v4
        with:
          name: nikolay-netlify-dist
          path: dist/
          if-no-files-found: error
          retention-days: 30
